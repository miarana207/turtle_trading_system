name: Binance Screener V3

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify files
        run: |
          echo "Repository:"
          pwd
          echo
          echo "Files:"
          find . -maxdepth 3 -type f | sort
          echo
          echo "Python:"
          python --version

      - name: Run Binance Multi-Market Screener
        env:
          BINANCE_BASE_URL: "https://data-api.binance.vision"
          BINANCE_SPOT_BASE_URL: "https://data-api.binance.vision"
          BINANCE_USDM_BASE_URL: "https://fapi.binance.com"
          BINANCE_COINM_BASE_URL: "https://dapi.binance.com"
          BINANCE_OPTIONS_BASE_URL: "https://eapi.binance.com"
          BINANCE_TOKENIZED_BASE_URL: "https://api.binance.com"

          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}

          ENABLE_SPOT: "true"
          ENABLE_MARGIN: "true"
          ENABLE_USDM_FUTURES: "true"
          ENABLE_COINM_FUTURES: "true"
          ENABLE_OPTIONS: "true"
          ENABLE_TOKENIZED_STOCKS: "true"

          # Spot : univers de quotes construit dynamiquement depuis exchangeInfo.
          QUOTE_ASSETS: ""
          EXCLUDE_STABLECOINS: "true"
          EXCLUDE_LEVERAGED_TOKENS: "true"
          MIN_24H_QUOTE_VOLUME: "1000000"
          MAX_SPREAD_PERCENT: "0.10"
          MIN_HISTORY_DAYS: "30"

          # Liquidité Spot : carnet réel, sans indicateur technique.
          ORDER_BOOK_DEPTH_ENABLED: "true"
          ORDER_BOOK_DEPTH_LIMIT: "100"
          ORDER_BOOK_DEPTH_PCT: "0.25"
          MIN_ORDER_BOOK_DEPTH_QUOTE: "25000"
          ORDER_BOOK_DEPTH_WORKERS: "8"

          # Reporting uniquement.
          BASE_ASSET_SUMMARY_LIMIT: "20"

          # Futures : filtrage marché/liquidité/tradabilité.
          FUTURES_QUOTE_ASSETS: "USDT,USDC"
          FUTURES_CONTRACT_TYPES: "PERPETUAL"
          MIN_FUTURES_QUOTE_VOLUME: "5000000"
          MIN_FUTURES_TRADES: "1000"
          MAX_FUTURES_SPREAD_PERCENT: "0.20"
          MIN_FUNDING_RATE_PERCENT: "-1.0"
          MAX_FUNDING_RATE_PERCENT: "1.0"

          # Options : filtrage explicite uniquement.
          OPTIONS_QUOTE_ASSETS: "USDT"
          MIN_OPTIONS_QUOTE_VOLUME: "0"
          MIN_OPTIONS_TRADES: "0"
          MAX_OPTIONS_SPREAD_PERCENT: "5.0"
          OPTIONS_MAX_ASSETS: "500"

          # Tokenized Stocks : API officielle, sans inférence par suffixe.
          TOKENIZED_MAX_ASSETS: "100"
          MAX_TOKENIZED_SPREAD_PERCENT: "1.0"

          HTTP_TIMEOUT_SECONDS: "20"
          HTTP_RETRIES: "3"

          EMAIL_HOST: "smtp.gmail.com"
          EMAIL_PORT: "465"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_TOP_RESULTS: "50"

        run: |
          python -u screener_v3_chop_adx_atr_table.py
